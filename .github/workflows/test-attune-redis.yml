name: Test attune-redis plugin

on:
  push:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  pull_request:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis,dev]"

      - name: Run plugin unit tests
        run: |
          python -m pytest attune_redis/tests/ -v \
            --ignore=attune_redis/tests/test_integration.py

      - name: Run protocol compliance tests
        run: |
          python -m pytest tests/unit/memory/test_memory_backend_protocol.py -v
