name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # TEMPORARY (2026-06-07): ubuntu matrix entries run on default
    # GitHub-hosted `ubuntu-latest` runners. The 8-core/32GB larger
    # runner (`ubuntu-8core-or-linux-32gb`) was de-provisioned, which left
    # the ubuntu Tests jobs unschedulable (no runner matched the label) —
    # so the routing was reverted to unblock CI. Follow-up: re-provision a
    # working larger runner and restore the conditional routing for the
    # ~2x parallelism + memory headroom (see the larger-runners spec).
    # macOS and Windows stay on default runners as before.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      # --timeout=60 + --timeout-method=thread: catches a hanging test by
      # name with a stack trace instead of letting it kill the xdist worker
      # silently. `thread` method is required for cross-platform support
      # (default `signal` uses SIGALRM, which is unreliable on Windows).
      #
      # `not integration` excludes tests marked @pytest.mark.integration —
      # they require live services (Claude API, Redis, etc.). Run them
      # separately via `pytest -m integration` against a configured env.
      #
      # `-n auto` (restored 2026-05-11 via probe-c Phase 4). The earlier
      # `-n 1` cap (PR #212) was a misdiagnosis: the OOM root cause was
      # one test's zombie thread allocating ~100k MagicMocks, not xdist
      # worker multiplication. Once the leaked thread was fixed (patch
      # to threading.Thread in test_subscribe_adds_to_subscriptions_dict),
      # parallel runs are safe again and ~3x faster.
      #
      # Coverage is intentionally NOT collected in this matrix — see the
      # dedicated `coverage:` job below. The matrix's job is to confirm
      # the suite passes on all platforms; coverage is a separate signal
      # that doesn't need the full matrix and gets memory-hammered when
      # combined with it.
      #
      # PROBE B mem-tick instrumentation retained: surfaces memory
      # regressions in CI logs without re-deriving the diagnostic.
      # shell: bash forces Git Bash on Windows runners.
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          echo "[mem-baseline $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "total="$2"MB used="$3"MB avail="$7"MB"}')"
          (while sleep 30; do echo "[mem-tick $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used="$3"MB avail="$7"MB"}')"; done) &
          MEM_MONITOR_PID=$!
          trap 'kill $MEM_MONITOR_PID 2>/dev/null || true' EXIT
        fi
        pytest -n auto --timeout=60 --timeout-method=thread -m "not network and not integration"
        if [ "${{ runner.os }}" = "Linux" ]; then
          echo "[mem-final $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used="$3"MB avail="$7"MB"}')"
        fi
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run security and workflow tests
      run: pytest tests/unit/memory/test_long_term_security.py tests/unit/scanner/test_file_traversal.py tests/unit/workflows/test_workflow_execution.py -v --tb=short

  coverage:
    # Dedicated coverage job — runs once on Linux 3.11 with branch
    # coverage on. Split out of the matrix to keep branch-coverage
    # signal centralized (one source of truth for the codecov upload)
    # and to avoid running it 12× across the platform matrix when one
    # run is sufficient. With the pubsub-thread leak fixed (probe-c)
    # and `-n auto` restored, this job runs in parallel like the
    # matrix tests.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python 3.11
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Catch README badge rot: fails if the tests-count floor over-claims or
    # drifts far below the real collected count, or if coverage regressed to a
    # hardcoded value instead of the dynamic Codecov badge. Cheap (collect-only).
    - name: Check README badge freshness
      run: python scripts/check_badge_freshness.py

    - name: Run tests with coverage
      run: |
        echo "[mem-baseline $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "total="$2"MB used="$3"MB avail="$7"MB"}')"
        (while sleep 30; do echo "[mem-tick $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used="$3"MB avail="$7"MB"}')"; done) &
        MEM_MONITOR_PID=$!
        trap 'kill $MEM_MONITOR_PID 2>/dev/null || true' EXIT
        pytest -n auto --cov=src/attune --cov-report=xml --cov-fail-under=85 --timeout=60 --timeout-method=thread -m "not network and not integration"
        echo "[mem-final $(date +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used="$3"MB avail="$7"MB"}')"
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Track per-file test results
      run: |
        python scripts/track_file_tests.py --coverage coverage.xml --limit 50
      continue-on-error: true

    - name: Upload file test tracking data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: file-test-tracking
        path: .empathy/file_tests.jsonl
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . 'black==24.10.0' ruff bandit[toml]

    - name: Check formatting with Black
      run: black --check .

    - name: Lint with Ruff
      run: ruff check .

    - name: Security scan with Bandit
      run: bandit -c .bandit -r src/ attune_software/ --severity-level medium --confidence-level medium

  platform-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Check cross-platform compatibility
      id: compat
      run: |
        python scripts/check_platform_compat.py src/ --json > compat-report.json
        python scripts/check_platform_compat.py src/ --fix

    - name: Upload compatibility report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-compat-report
        path: compat-report.json

    - name: Fail on errors (non-blocking for now)
      run: |
        ERRORS=$(python -c "import json; r=json.load(open('compat-report.json')); print(r['summary']['errors'])")
        if [ "$ERRORS" -gt 0 ]; then
          echo "::warning::Found $ERRORS cross-platform compatibility errors"
        fi
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[software]

    - name: Count tech debt markers
      id: debt
      run: |
        # Count TODO, FIXME, HACK, XXX markers
        DEBT_COUNT=$(grep -rE "(TODO|FIXME|HACK|XXX):" --include="*.py" src/ attune_software/ 2>/dev/null | wc -l || echo 0)
        echo "debt_count=$DEBT_COUNT" >> $GITHUB_OUTPUT
        echo "Found $DEBT_COUNT tech debt markers"

        # Warn if above threshold (configurable)
        THRESHOLD=400
        if [ "$DEBT_COUNT" -gt "$THRESHOLD" ]; then
          echo "::warning::Tech debt count ($DEBT_COUNT) exceeds threshold ($THRESHOLD)"
        fi

        # Count permanently-skipped tests (pytest.mark.skip, not skipif)
        SKIP_COUNT=$(grep -rn "pytest\.mark\.skip\b" tests/ --include="*.py" 2>/dev/null | wc -l || echo 0)
        echo "skip_count=$SKIP_COUNT" >> $GITHUB_OUTPUT
        echo "Found $SKIP_COUNT permanent skip markers"

        # Warn if skip count creeps back up (baseline after April 2026 cleanup: 42)
        SKIP_THRESHOLD=60
        if [ "$SKIP_COUNT" -gt "$SKIP_THRESHOLD" ]; then
          echo "::warning::Permanent skip count ($SKIP_COUNT) exceeds threshold ($SKIP_THRESHOLD) — review and delete obsolete skipped tests"
        fi

    - name: Upload debt report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tech-debt-report
        path: |
          patterns/tech_debt/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-packages
        path: dist/
