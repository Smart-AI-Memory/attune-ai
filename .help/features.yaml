version: 1

features:
  security-audit:
    description: Scan code for security vulnerabilities — eval/exec, path traversal, hardcoded secrets, injection risks
    files:
      - src/attune/workflows/security_audit.py
      - src/attune/security/**
      - src/attune/monitoring/**
    tags: [security, audit, owasp, scanning]

  code-quality:
    description: Review code for style issues, likely bugs, and structural problems
    files:
      - src/attune/workflows/code_review.py
      - src/attune/workflows/code_review_*.py
    tags: [review, quality, bugs]

  smart-test:
    description: Find untested code and generate pytest tests with edge cases
    files:
      - src/attune/workflows/test_gen/**
      - src/attune/workflows/test_audit/**
      - src/attune/workflows/test_gen_parallel.py
    tags: [tests, coverage, generation]

  doc-gen:
    description: Generate documentation from source code — docstrings, README sections, API references
    files:
      - src/attune/workflows/document_gen/**
    tags: [docs, documentation, generation]

  bug-predict:
    description: Predict likely bug locations based on code patterns and complexity
    files:
      - src/attune/workflows/bug_predict.py
      - src/attune/workflows/bug_predict_*.py
    tags: [bugs, prediction, scanning]

  release-prep:
    description: Pre-release quality gate — health checks, security audit, changelog, version bumps
    files:
      - src/attune/workflows/release_prep.py
      - src/attune/agents/release/**
    tags: [release, publishing, quality]

  refactor-plan:
    description: Detect code smells and generate a prioritized refactoring roadmap
    files:
      - src/attune/workflows/refactor_plan.py
      - src/attune/workflows/refactor_plan_report.py
    tags: [refactor, tech-debt, complexity]

  deep-review:
    description: Multi-pass deep code review — security, quality, and test gap analysis
    files:
      - src/attune/workflows/deep_review.py
    tags: [review, security, quality, tests]

  fix-test:
    description: Auto-diagnose and fix failing tests — identifies root causes and applies fixes
    files:
      - src/attune/workflows/test_runner.py
      - src/attune/workflows/test_maintenance.py
      - src/attune/workflows/test_lifecycle.py
    tags: [tests, debugging, fixes]

  mcp-server:
    description: Model Context Protocol server and tool handlers
    files:
      - src/attune/mcp/**
    tags: [mcp, tools, server]

  help-system:
    description: Progressive-depth help engine and template management
    files:
      - src/attune/help/**
      - packages/attune-help/src/attune_help/**
    tags: [help, templates, docs]

  memory:
    description: Memory subsystem — storage, retrieval, and security
    files:
      - src/attune/memory/**
    tags: [memory, storage]

  agents:
    description: Release agents, state persistence, and recovery
    files:
      - src/attune/agents/**
      - src/attune/agent_factory/**
    tags: [agents, ai, release]

  cli:
    description: Command-line interface and routing
    files:
      - src/attune/cli_minimal.py
      - src/attune/cli_router.py
      - src/attune/cli_commands/**
    tags: [cli, commands]

  models:
    description: LLM authentication, provider routing, and tier management
    files:
      - src/attune/models/**
    tags: [models, auth, llm]

  orchestration:
    description: Dynamic teams, workflow composition, and agent models
    files:
      - src/attune/orchestration/**
      - src/attune/coordination/**
    tags: [orchestration, teams]

  telemetry:
    description: Usage tracking and feedback loops
    files:
      - src/attune/telemetry/**
    tags: [telemetry, metrics]

  plugin:
    description: Claude Code plugin — skills, hooks, commands, and MCP config
    files:
      - plugin/**
    tags: [plugin, claude-code]

  spec-engine:
    description: Spec-driven development with approval loops
    files:
      - src/attune/spec/**
      - src/attune/pipeline/**
    tags: [spec, planning]

  wizards:
    description: Multi-step guided interactive workflows
    files:
      - src/attune/wizards/**
    tags: [wizards, interactive]

  configuration:
    description: Project configuration and settings management
    files:
      - src/attune/config/**
    tags: [config, settings]

  rag-grounding:
    description: RAG-grounded code generation — retrieves attune-help context via attune-rag, feeds citation-forced prompts to Claude, emits answers with provenance
    files:
      - src/attune/workflows/rag_code_gen.py
    tags: [rag, retrieval, grounding, faithfulness, citation]
