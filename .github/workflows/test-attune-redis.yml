name: Test attune-redis plugin

on:
  push:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  pull_request:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis,dev]"

      - name: Run plugin unit tests
        run: |
          python -m pytest attune_redis/tests/ -v \
            --ignore=attune_redis/tests/test_integration.py

      - name: Run protocol compliance tests
        run: |
          python -m pytest tests/unit/memory/test_memory_backend_protocol.py -v
