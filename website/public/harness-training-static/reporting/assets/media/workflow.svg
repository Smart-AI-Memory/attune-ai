<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="title desc"><title id="title">You direct a bounded task</title><desc id="desc">Define and approve scope; the assistant proposes; Harness applies and checks; you assess separate review.</desc><rect width="900" height="210" rx="18" fill="#eef1e9"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#183e34" font-size="18" font-weight="650">YOU DIRECT A BOUNDED TASK</text><g fill="#ffffff" stroke="#b6c7ba"><rect x="25" y="65" width="180" height="115" rx="12"/><rect x="245" y="65" width="180" height="115" rx="12"/><rect x="465" y="65" width="180" height="115" rx="12"/><rect x="685" y="65" width="190" height="115" rx="12"/></g><g fill="#1c493a" font-size="17" text-anchor="middle"><text x="115" y="103" font-weight="700">You</text><text x="115" y="134">Define + approve</text><text x="115" y="158">the scope</text><text x="335" y="103" font-weight="700">Assistant</text><text x="335" y="134">Proposes the</text><text x="335" y="158">implementation</text><text x="555" y="103" font-weight="700">Harness</text><text x="555" y="134">Applies + checks</text><text x="555" y="158">allowed changes</text><text x="780" y="103" font-weight="700">You</text><text x="780" y="134">Assess checks</text><text x="780" y="158">+ separate review</text></g><g fill="#59836e" font-size="28" text-anchor="middle"><text x="225" y="133">→</text><text x="445" y="133">→</text><text x="665" y="133">→</text></g></g></svg>
