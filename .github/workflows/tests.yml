name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change needs the full cross-platform matrix.
  # A diff that touches no source/packaging files (tests-only, docs-only)
  # cannot introduce a cross-platform SOURCE regression, so it runs a slim
  # matrix instead of all 12 lanes. Fail-safe: anything other than a clean
  # PR diff that misses every trigger path falls back to the FULL matrix
  # (run more, never fewer required signals).
  # See docs/specs/ci-matrix-right-sizing/.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
      website_only: ${{ steps.filter.outputs.website_only }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - id: filter
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        # Non-PR events (push to main/develop, manual dispatch) always get
        # the full matrix — the slim path is a PR-iteration optimization.
        if [ "$EVENT" != "pull_request" ] || [ -z "${BASE_REF:-}" ]; then
          echo "event=$EVENT -> full matrix"
          echo "src=true" >> "$GITHUB_OUTPUT"
          echo "website_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git fetch --no-tags --quiet origin "$BASE_REF" || true
        if ! CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
          echo "diff failed -> full matrix (fail-safe)"
          echo "src=true" >> "$GITHUB_OUTPUT"
          echo "website_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "changed files:"; printf '%s\n' "$CHANGED"
        # Trigger paths (D2): any source/packaging change, or a change to
        # THIS workflow, needs full cross-platform validation.
        if printf '%s\n' "$CHANGED" | grep -qE '^(src/|pyproject\.toml|setup\.cfg|\.github/workflows/tests\.yml)'; then
          echo "src=true (source/packaging touched) -> full matrix"
          echo "src=true" >> "$GITHUB_OUTPUT"
        else
          echo "src=false (tests/docs-only) -> slim matrix"
          echo "src=false" >> "$GITHUB_OUTPUT"
        fi
        # website_only (D-website): if EVERY changed file is under website/,
        # the Python suite cannot be affected — the full-suite jobs (test,
        # clock-tz, coverage) no-op their pip-install + pytest steps. The
        # jobs still RUN and report green, so the required checks
        # (test (ubuntu-latest, 3.12), coverage) are never "missing" and the
        # PR is not blocked — same discipline as the slim matrix above.
        if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '^website/'; then
          echo "website_only=true (only website/ touched) -> skip Python suite"
          echo "website_only=true" >> "$GITHUB_OUTPUT"
        else
          echo "website_only=false" >> "$GITHUB_OUTPUT"
        fi

  # Emit the test matrix JSON. CRITICAL: the slim matrix MUST keep the
  # `test (ubuntu-latest, 3.12)` lane — that exact job name is a REQUIRED
  # status check, and a required check that never runs reports as "missing"
  # → the PR is blocked forever. Both variants are cartesian-shaped so the
  # job name is identical (`test (<os>, <python-version>)`). If the required
  # Python pin ever changes here, update branch protection in lockstep.
  setup-matrix:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
    - id: set
      shell: bash
      run: |
        if [ "${{ needs.changes.outputs.src }}" = "true" ]; then
          echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13","3.14"]}' >> "$GITHUB_OUTPUT"
        else
          # slim (D1): the required ubuntu-3.12 lane + one Windows smoke
          echo 'matrix={"os":["ubuntu-latest","windows-latest"],"python-version":["3.12"]}' >> "$GITHUB_OUTPUT"
        fi

  test:
    needs: [changes, setup-matrix]
    # All lanes run on free GitHub-hosted standard runners by design. An
    # 8-core/32GB larger runner (`ubuntu-8core-or-linux-32gb`) was
    # de-provisioned 2026-06-07; restoring it was evaluated 2026-06-26 and
    # declined — ubuntu lanes already finish in ~4 min, and the recurring
    # runner-hang it might have helped is an xdist finalize-deadlock, not
    # memory pressure, so the headroom would not fix it.
    runs-on: ${{ matrix.os }}
    # ci-runner-hang spec: tightened from 75 so a wedged pytest step fails
    # in bounded time (and is rerun-recoverable) instead of stalling for
    # over an hour. A flat int (not a per-OS ${{ }} expression) keeps the
    # `test_timeout_values_are_reasonable` guard happy AND stays generous
    # enough for Windows/macOS (normal ~13-15 min) to avoid false-fails.
    # The early faulthandler dump (conftest, ~10 min) is what captures the
    # hang stack; this timeout is only the kill-backstop, so it need not be
    # OS-tight.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Skip notice (website-only PR)
      if: needs.changes.outputs.website_only == 'true'
      run: echo "website-only change — Python suite skipped; reporting green for the required check."

    - name: Install dependencies
      if: needs.changes.outputs.website_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Install attune-rag for the model-tiers drift test
      if: needs.changes.outputs.website_only != 'true'
      # attune-ai does NOT depend on attune-rag (deliberately absent from
      # pyproject) — the plugin installs standalone. This step exists only
      # so tests/unit/test_model_tiers_drift.py runs instead of skipping:
      # attune.model_tiers mirrors the canonical attune_rag.model_tiers
      # contract, and drift between the copies must fail CI, not ship.
      # >=0.8 is the first attune-rag release that carries model_tiers.
      run: pip install "attune-rag>=0.8"

    - name: Run tests
      if: needs.changes.outputs.website_only != 'true'
      # --timeout=60 + --timeout-method=thread: names a hanging test (with a
      # stack trace) instead of letting it silently kill the xdist worker.
      # The `thread` method is required cross-platform (`signal`/SIGALRM is
      # unreliable on Windows).
      #
      # `not integration` excludes @pytest.mark.integration tests — they need
      # live services (Claude API, Redis, etc.). Run them separately via
      # `pytest -m integration` against a configured env.
      #
      # `-n auto`: parallel xdist. (The old `-n 1` cap, PR #212, was a
      # misdiagnosis — the OOM root cause was one test's zombie thread, since
      # fixed.)
      #
      # Coverage is collected by the dedicated `coverage:` job, not here — the
      # matrix only confirms the suite passes on every platform.
      #
      # The runner-hang that once required a 14m-timeout + 2× auto-retry
      # wrapper on this lane was root-caused and fixed in #930 (a fork-based
      # multiprocessing.Pool inside an xdist worker leaked the execnet socket
      # FD, deadlocking the controller at ~99%; Linux-only because macOS uses
      # `spawn`). With the cause gone, the plain invocation runs on all
      # platforms — the 35m job `timeout-minutes` plus the conftest
      # hang-watchdog (which still uploads hang-dumps/) remain as the backstop.
      #
      # shell: bash forces Git Bash on Windows runners.
      shell: bash
      run: |
        pytest -n auto --timeout=60 --timeout-method=thread -m "not network and not integration"
      env:
        ANTHROPIC_API_KEY: ""  # keyless by design — live-key CI burned $1200+ on 2026-06-10 (mismarked tests make real API calls when keyed); the real secret is for integration-auth.yml + deliberate dispatches ONLY

    - name: Run security and workflow tests
      if: needs.changes.outputs.website_only != 'true'
      run: pytest tests/unit/memory/test_long_term_security.py tests/unit/scanner/test_file_traversal.py tests/unit/workflows/test_workflow_execution.py -v --tb=short

    # ci-runner-hang Phase 2: the conftest watchdog writes each process's
    # all-thread stack to hang-dumps/hang-<worker>.txt. Surface + upload it
    # with `if: always()` so a worker dump SURVIVES a `timeout-minutes` kill
    # (the Phase 1 gap: a worker's raw stderr dump is lost when execnet
    # never forwards it on a hang). Empty (armed-but-never-fired) dumps are
    # pruned so a healthy run produces no artifact.
    - name: Surface hang-watchdog dumps
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        found=0
        for f in hang-dumps/*.txt; do
          if [ -s "$f" ]; then
            found=1
            echo "::group::HANG DUMP — $f"
            cat "$f"
            echo "::endgroup::"
          else
            rm -f "$f"
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "hang-watchdog: no dump fired (healthy run)."
        else
          echo "::warning::hang-watchdog captured a stack — a worker/controller wedged. See the hang-dumps artifact."
        fi

    - name: Upload hang-watchdog dumps
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: hang-dumps-test-${{ matrix.os }}-${{ matrix.python-version }}
        path: hang-dumps/
        if-no-files-found: ignore
      continue-on-error: true

  clock-tz:
    # Hostile-clock lane: runs the unit suite under extreme NON-UTC
    # timezones so date/TZ bugs (the #867 / #868 clock-mix class) fail in
    # CI instead of in production. GitHub-hosted runners default to UTC, so
    # the 12-lane `test` matrix only ever exercises the UTC path — this is
    # the one place a "local date.today() vs UTC-keyed bucket" mix gets
    # caught. Two TZs bracket the bug in both directions:
    #   Pacific/Kiritimati  UTC+14  (local AHEAD of UTC — evening rolls over)
    #   America/Anchorage   UTC-9   (local BEHIND UTC — morning lags)
    #
    # Runs ALWAYS (no slim/full gate): a tests-only PR adding a
    # wall-clock-dependent test is exactly what this guards. Keyless by
    # design. NOT a required check yet — promote in branch protection once
    # it has a few green runs (needs the GitHub-Actions app_id; tracked
    # separately, deliberately out of scope for this PR).
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz: ["Pacific/Kiritimati", "America/Anchorage"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Skip notice (website-only PR)
      if: needs.changes.outputs.website_only == 'true'
      run: echo "website-only change — hostile-clock suite skipped."

    - name: Set up Python 3.12
      if: needs.changes.outputs.website_only != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      if: needs.changes.outputs.website_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run unit suite under ${{ matrix.tz }}
      if: needs.changes.outputs.website_only != 'true'
      shell: bash
      run: |
        python -c "import time, datetime; print('TZ=', time.tzname, 'utcoffset=', datetime.datetime.now().astimezone().utcoffset())"
        pytest -n auto --timeout=60 --timeout-method=thread -m "not network and not integration"
      env:
        TZ: ${{ matrix.tz }}
        ANTHROPIC_API_KEY: ""  # keyless by design — see the `test` job note

  coverage:
    # Dedicated coverage job — runs once on Linux 3.11 with branch
    # coverage on. Split out of the matrix to keep branch-coverage
    # signal centralized (one source of truth for the codecov upload)
    # and to avoid running it 12× across the platform matrix when one
    # run is sufficient. With the pubsub-thread leak fixed (probe-c)
    # and `-n auto` restored, this job runs in parallel like the
    # matrix tests.
    runs-on: ubuntu-latest
    # ci-gating-lane-isolation Layer A: the job timeout is now the FINAL
    # backstop (both auto-retry attempts hung), not the first line of
    # defence — the 14m step-level `timeout` below kills a single wedged
    # attempt fast and retries in-run. Sized to fit 2×14m attempts plus
    # pip-install/badge/codecov overhead (was 25, pre-retry). Stays well
    # under the guard's 75-min ceiling.
    timeout-minutes: 40
    needs: changes
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Skip notice (website-only PR)
      if: needs.changes.outputs.website_only == 'true'
      run: echo "website-only change — coverage suite skipped; reporting green for the required check."

    - name: Set up Python 3.11
      if: needs.changes.outputs.website_only != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      if: needs.changes.outputs.website_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Catch README badge rot: fails if the tests-count floor over-claims or
    # drifts far below the real collected count, or if coverage regressed to a
    # hardcoded value instead of the dynamic Codecov badge. Cheap (collect-only).
    - name: Check README badge freshness
      if: needs.changes.outputs.website_only != 'true'
      run: python scripts/check_badge_freshness.py

    # Capability-count projector (roundtable q-capability-count-projector-001):
    # the three derived counts (skills, registered MCP tools, core-schema MCP
    # tools) must match every allowlisted claim site. Needs an importable
    # attune — this job just installed it. Repair drift with:
    #   python scripts/project_capabilities.py --write
    - name: Check capability count claims
      if: needs.changes.outputs.website_only != 'true'
      run: python scripts/project_capabilities.py --check

    - name: Run tests with coverage
      # Coverage RATCHET: --cov-fail-under is a one-way valve, not a static
      # floor. Main has measured 94.69–94.71% across recent runs (stable to
      # ~0.02%); the gate sits at 94 (≈0.7pt headroom for normal churn). The
      # old 85 left a ~9.7pt silent-erosion slack — coverage could fall from
      # ~94.7 to 85 without CI noticing. RATCHET POLICY: only ever raise this
      # number (when main climbs and holds above floor+~1), never lower it to
      # make a red PR pass — a drop is a signal to add tests, not slacken the
      # gate. (pyproject's fail_under stays 85 as the absolute floor for
      # ad-hoc/partial local runs whose --cov scope differs from CI's.)
      if: needs.changes.outputs.website_only != 'true'
      run: |
        # The runner-hang that once required a 14m-timeout + 2× auto-retry
        # wrapper on this lane was root-caused and fixed in #930 (a fork-based
        # multiprocessing.Pool inside an xdist worker leaked the execnet socket
        # FD, deadlocking the controller at ~99%; Linux-only because macOS uses
        # `spawn`). With the cause gone, run coverage plainly — the job
        # `timeout-minutes` plus the conftest hang-watchdog (which still
        # uploads hang-dumps/) remain as the backstop.
        pytest -n auto --cov=src/attune --cov-report=xml --cov-fail-under=94 --timeout=60 --timeout-method=thread -m "not network and not integration"
      env:
        ANTHROPIC_API_KEY: ""  # keyless by design — live-key CI burned $1200+ on 2026-06-10 (mismarked tests make real API calls when keyed); the real secret is for integration-auth.yml + deliberate dispatches ONLY

    - name: Track per-file test results
      if: needs.changes.outputs.website_only != 'true'
      run: |
        python scripts/track_file_tests.py --coverage coverage.xml --limit 50
      continue-on-error: true

    - name: Upload file test tracking data
      if: needs.changes.outputs.website_only != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: file-test-tracking
        path: .empathy/file_tests.jsonl
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: needs.changes.outputs.website_only != 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # ci-runner-hang Phase 2: surface + upload the worker/controller hang
    # dumps so a `timeout-minutes` kill on this lane (the lane that wedged
    # in run 27488685349) carries a named stack. See the `test` job note.
    - name: Surface hang-watchdog dumps
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        found=0
        for f in hang-dumps/*.txt; do
          if [ -s "$f" ]; then
            found=1
            echo "::group::HANG DUMP — $f"
            cat "$f"
            echo "::endgroup::"
          else
            rm -f "$f"
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "hang-watchdog: no dump fired (healthy run)."
        else
          echo "::warning::hang-watchdog captured a stack — a worker/controller wedged. See the hang-dumps artifact."
        fi

    - name: Upload hang-watchdog dumps
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: hang-dumps-coverage
        path: hang-dumps/
        if-no-files-found: ignore
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . 'black==24.10.0' ruff bandit[toml]

    - name: Check formatting with Black
      run: black --check .

    - name: Lint with Ruff
      run: ruff check .

    - name: Security scan with Bandit
      run: bandit -c .bandit -r src/ attune_software/ --severity-level medium --confidence-level medium

  # Gate on the WHOLE test matrix, not just the two required lanes.
  #
  # Branch protection requires `test (ubuntu-latest, 3.12)` and
  # `test (windows-latest, 3.12)`. On a full-matrix run the other ten
  # lanes — including windows 3.10/3.11/3.13/3.14 — report but gate
  # nothing, so a Windows-only regression can merge green and then sit on
  # main while every later PR shows the same red lanes that nothing
  # blocks on. That has happened (see the "admin-merging before Windows
  # lanes complete" and "auto-merge ignores non-required lanes" lessons).
  #
  # Adding those lanes to branch protection directly does NOT work: the
  # slim matrix does not run them, and a required check that never runs
  # reports as "missing" and blocks the PR forever. So instead this job
  # ALWAYS runs, aggregates whatever the matrix actually did, and is the
  # single required context. Slim run -> nothing failed -> green. Full
  # run with a red windows 3.13 -> red, and the merge is blocked.
  test-matrix-complete:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every test lane that ran to have passed
      shell: bash
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        set -euo pipefail
        echo "test matrix result: $RESULT"
        case "$RESULT" in
          success|skipped)
            echo "All test lanes that ran passed (or the matrix was skipped)."
            ;;
          *)
            echo "::error::One or more test lanes did not pass (result: $RESULT)."
            echo "Check the non-required lanes too — windows 3.10/3.11/3.13/3.14"
            echo "are exactly the ones this gate exists to catch."
            exit 1
            ;;
        esac

  platform-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Check cross-platform compatibility
      id: compat
      run: |
        python scripts/check_platform_compat.py src/ --json > compat-report.json
        python scripts/check_platform_compat.py src/ --fix || true

    - name: Upload compatibility report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-compat-report
        path: compat-report.json

    # This step USED to warn and `continue-on-error: true`, which made
    # `platform-compat` a required check that could not fail — and even
    # without that, no platform rule emitted `error`, so the only error
    # severity was the scanner failing to read a file. It gated nothing.
    #
    # Now: `missing_encoding` is an error (a text-mode open() without
    # encoding uses the Windows locale codepage, not UTF-8 — the
    # highest-yield source of Windows-only breakage here), the 44
    # pre-existing instances are fixed, and this step FAILS the build.
    #
    # The other categories (hardcoded home/etc/tmp paths, os.path
    # preference) stay warnings for now and are reported below without
    # failing — the agreed sequence is encoding first, then ratchet the
    # rest against a baseline.
    - name: Fail on cross-platform errors
      run: |
        set -euo pipefail
        python - <<'EOF'
        import json, sys
        report = json.load(open("compat-report.json"))
        summary = report["summary"]
        errors = summary["errors"]
        print(f"scanned {summary['files_scanned']} files: "
              f"{errors} error(s), {summary['warnings']} warning(s)")
        if summary["warnings"]:
            print(f"::notice::{summary['warnings']} cross-platform warnings "
                  "(not yet gated — see the encoding-first ratchet)")
        if errors:
            for issue in report.get("issues", []):
                if issue.get("severity") == "error":
                    print(f"::error file={issue['file']},line={issue['line']}::"
                          f"{issue['message']}")
            sys.exit(1)
        EOF

    # The ratchet. The 22 pre-existing warnings (hardcoded home/etc/tmp
    # paths) cannot be mechanically cleared the way the encoding errors
    # were, so they are ACCEPTED in `.platform-compat-baseline.json` and
    # anything beyond them fails. Keyed on file+category rather than line,
    # so moving code never trips it — a baseline that cries wolf gets
    # regenerated reflexively, which is the same as not having one.
    #
    # Fixing warnings is reported as an improvement, not a failure, with
    # the command to shrink the baseline. CI never regenerates it: a
    # self-updating baseline accepts every regression it exists to catch.
    - name: No new cross-platform warnings (ratchet)
      run: python scripts/check_platform_compat.py src/ --baseline

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[software]

    - name: Count tech debt markers
      id: debt
      run: |
        # Count TODO, FIXME, HACK, XXX markers
        DEBT_COUNT=$(grep -rE "(TODO|FIXME|HACK|XXX):" --include="*.py" src/ attune_software/ 2>/dev/null | wc -l || echo 0)
        echo "debt_count=$DEBT_COUNT" >> $GITHUB_OUTPUT
        echo "Found $DEBT_COUNT tech debt markers"

        # Warn if above threshold (configurable)
        THRESHOLD=400
        if [ "$DEBT_COUNT" -gt "$THRESHOLD" ]; then
          echo "::warning::Tech debt count ($DEBT_COUNT) exceeds threshold ($THRESHOLD)"
        fi

        # Count permanently-skipped tests (pytest.mark.skip, not skipif)
        SKIP_COUNT=$(grep -rn "pytest\.mark\.skip\b" tests/ --include="*.py" 2>/dev/null | wc -l || echo 0)
        echo "skip_count=$SKIP_COUNT" >> $GITHUB_OUTPUT
        echo "Found $SKIP_COUNT permanent skip markers"

        # Warn if skip count creeps back up (baseline after April 2026 cleanup: 42)
        SKIP_THRESHOLD=60
        if [ "$SKIP_COUNT" -gt "$SKIP_THRESHOLD" ]; then
          echo "::warning::Permanent skip count ($SKIP_COUNT) exceeds threshold ($SKIP_THRESHOLD) — review and delete obsolete skipped tests"
        fi

    - name: Upload debt report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tech-debt-report
        path: |
          patterns/tech_debt/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-packages
        path: dist/

  default-install-smoke:
    # REQUIRED gate. A default install (`pip install attune-ai`, no extras)
    # must boot the base CLI. Catches the class of bug where the base CLI
    # transitively imports an extras-only dependency (e.g. fastapi from the
    # [ops] extra) and crashes on startup — invisible to the rest of the
    # suite, which always installs the extras. 8.5.0 shipped exactly this
    # (attune --help -> ModuleNotFoundError: fastapi). Also probes the
    # personal-memory capture -> recall round-trip under a fake HOME,
    # asserting on recall CONTENT: 9.3.0 shipped with recall broken
    # (exit 0, "No results found.") while unit tests stayed green because
    # they mocked the broken RAG layer. Self-contained (it
    # builds its own wheel) so it never skips on an upstream failure — a
    # skipped required check would block every merge.
    name: default-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build tooling
      run: python -m pip install --upgrade pip build

    - name: Smoke the default install (no extras)
      run: bash scripts/smoke_default_install.sh
