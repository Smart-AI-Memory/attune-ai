name: Help Freshness

on:
  schedule:
    # Sunday 12:00 UTC
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[author]'
          pip install PyYAML

      - name: Check completeness (pre-regen)
        run: |
          python scripts/check_help_completeness.py --format=json \
            > /tmp/completeness-before.json || true
          cat /tmp/completeness-before.json

      - name: List stale features
        id: list_stale
        run: |
          python scripts/list_stale_help_features.py \
            --help-dir .help --project-root . > /tmp/stale.txt
          echo "stale features:"
          cat /tmp/stale.txt || true
          count=$(wc -l < /tmp/stale.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Regenerate stale features
        if: steps.list_stale.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          while IFS= read -r feat; do
            [ -z "$feat" ] && continue
            echo "--- regen $feat ---"
            attune-author generate "$feat" \
              --help-dir .help --project-root . --all-kinds
          done < /tmp/stale.txt

      - name: Check completeness (post-regen)
        run: |
          python scripts/check_help_completeness.py --format=json \
            > /tmp/completeness-after.json || true
          cat /tmp/completeness-after.json

      - name: Open PR if there are changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "$(git status --porcelain .help/)" ]; then
            echo "No .help changes to commit."
            exit 0
          fi
          branch="auto/help-freshness-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .help
          {
            echo "docs(help): weekly freshness regen"
            echo
            echo "Auto-regenerated stale .help/ templates via the help-freshness"
            echo "workflow. See completeness reports in the workflow logs."
            echo
            echo "See scripts/check_help_completeness.py for orphan detection."
          } > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt
          git push origin "$branch"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^0$'; then
            {
              echo "Automated regen of stale .help/ templates."
              echo
              echo "- Workflow: .github/workflows/help-freshness.yml"
              echo "- Regenerator: attune-author generate <feature> --all-kinds"
              echo "- Completeness: python scripts/check_help_completeness.py"
              echo
              echo "Review the diff and merge if the regenerated content looks correct."
              echo "If orphan dirs still appear in the completeness report, decide"
              echo "whether to delete them or add them to the manifest."
            } > /tmp/pr_body.txt
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs(help): weekly freshness regen ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/pr_body.txt
          else
            echo "PR already open for $branch - skipping create."
          fi
