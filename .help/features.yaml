  # hand-authored (it is not a projected feature page). Note: the prior
  # `files:` glob conflated `src/attune/monitoring/**` (a separate
  # subsystem) with the audit workflow; the projected docs scope to the
  # workflow only. See docs/specs/help-docs-single-source/.
