name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # wiring-audit job — also fire on source / script changes that
      # could break docs references (anchor links, mkdocstrings symbols).
      - 'src/**'
      - 'scripts/audit_docs_wiring.py'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'
      - 'scripts/audit_docs_wiring.py'
      # .help/** regen feeds rendered docs; include it so a regen PR
      # hits the mkdocs --strict pre-flight (docs-link-prevalidation
      # CI safety net — no separate workflow needed, this job already
      # runs `mkdocs build --strict`).
      - '.help/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Wiring-audit job — advisory mode per docs/specs/docs-wiring-audit/
  # tasks.md Task 7. NOT yet in required_status_checks; Task 8 will
  # promote once main has held 3 consecutive green runs. Script is
  # stdlib-only so this job needs no dependency install — just
  # checkout + a Python interpreter (any 3.10+).
  wiring-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          # No actual install needed (script is stdlib-only) but the
          # `cache: pip` field is required by the repo-wide CI guard
          # in tests/unit/ci/test_workflow_yaml.py::TestPipCaching.
          # Cache is a no-op here — there's nothing to cache.
          cache: 'pip'

      - name: Run wiring audit
        run: python scripts/audit_docs_wiring.py --format json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
