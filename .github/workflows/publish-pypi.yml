name: Publish to PyPI

on:
  # Trigger on tag push rather than release-published. Releases created by
  # GITHUB_TOKEN (i.e. by another workflow, like release.yml) do NOT fire
  # the `release:[published]` event — a documented GitHub Actions
  # limitation that bit us on the v7.1.0 ship (PyPI publish had to be
  # dispatched manually). Tag-push fires unconditionally regardless of
  # the actor, so the chain release.yml → tag → publish-pypi works.
  push:
    tags:
      - 'v*.*.*'  # match release.yml; runs in parallel with it
  workflow_dispatch:  # Manual fallback / re-run on demand

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: pip install build uv

      - name: Build package
        run: python -m build

      # Artifact-level recall gate (curated-memory spec T7): installs the
      # just-built wheel into a clean venv with an isolated $HOME and
      # proves the user-facing `attune memory capture` -> `recall`
      # round-trip. Exists because 9.3.0 shipped with recall 100% broken
      # while the full mocked test matrix was green — the checkout was
      # tested, the artifact never was. A failure here means DO NOT SHIP.
      - name: Recall gate (built artifact)
        run: python scripts/release_recall_gate.py --wheel 'dist/attune_ai-*.whl'

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No token needed - uses OIDC trusted publishing
