# Pre-commit hooks for Attune AI
# Run: pre-commit install
# Manual run: pre-commit run --all-files

# Exclude generated and third-party directories
exclude: |
  (?x)^(
    site/|
    website/public/|
    \.venv/|
    test_env/|
    build/|
    dist/|
    .*\.egg-info/|
    wizards/
  )

repos:
  # Black - Code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff
        name: ruff-bare-exception-check
        args: ['--select=BLE', '--no-fix']
        # Prevents bare except clauses from being committed
        # See docs/EXCEPTION_HANDLING_GUIDE.md for best practices

  # MyPy removed from pre-commit — duplicate module
  # (attune.config.py vs attune.config/) causes persistent failures.
  # Run mypy separately: uv run mypy src/

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-c', '.bandit', '-r', 'src/', 'attune_software/', '--severity-level', 'medium', '--confidence-level', 'medium']
        pass_filenames: false

  # Detect-secrets - Prevent secrets from being committed
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.env\.example$|
            .*\.md$|
            .*\.json$|
            .*_audit.*\.py$|
            .*\.html$|
            tests/|
            website/|
            src/|
            attune_software/|
            memdocs_storage/|
            demo_security_complete\.py$|
            test_memory_integration\.py$|
            profile_.*\.py$|
            docs/|
            examples/|
            anthropic-cookbook/
          )

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs.*\.yml$  # Uses custom YAML constructors
      - id: check-added-large-files
        args: ['--maxkb=1200']  # uv.lock is ~1076KB
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Note: Import sorting handled by ruff's "I" rules (isort plugin)
  # Removed standalone isort to avoid conflicts with ruff

  # Pattern summary auto-regeneration
  # Regenerates patterns_summary.md when pattern JSON files change
  - repo: local
    hooks:
      - id: regenerate-patterns
        name: Regenerate Pattern Summary
        entry: python -m attune.patterns.summary
        language: python
        pass_filenames: false
        files: ^patterns/.*\.json$
        stages: [manual]  # Requires project installation

      # Pattern-based code review (optional - enable with 'stages: [commit]')
      # Reviews staged code against historical bug patterns
      - id: pattern-review
        name: Pattern-Based Code Review
        entry: python -m attune.cli review --staged --severity warning
        language: python
        pass_filenames: false
        stages: [manual]  # Run manually with: pre-commit run pattern-review
        # Change to 'stages: [commit]' to run automatically on every commit

      # Cross-platform compatibility check
      # Detects hardcoded paths, missing encoding, asyncio issues
      - id: platform-compat
        name: Cross-Platform Compatibility Check
        entry: python scripts/check_platform_compat.py src/ attune_software/
        language: python
        pass_filenames: false
        stages: [manual]  # Run manually with: pre-commit run platform-compat
        # Change to 'stages: [commit]' to run automatically on every commit

      # Help template freshness check
      # Warns when doc source files change without template regeneration
      # Set ATTUNE_DOCS_AUTOREGEN=1 to auto-regenerate on commit
      - id: check-docs-freshness
        name: Check Help Template Freshness
        entry: uv run python scripts/check_docs_freshness.py
        language: system
        pass_filenames: false
        files: >-
          ^\.claude/CLAUDE\.md$|
          ^plugin/skills/.*/SKILL\.md$|
          ^src/attune/mcp/tool_schemas\.py$
        stages: [pre-commit]

      # .help/templates/ staleness WARNING on source changes (check-only).
      # Detects which features' source globs match the changed files in
      # this commit (via `attune_author.load_manifest`) and prints them.
      # Never regenerates, never spends LLM budget, never blocks the
      # commit — polish-bearing regen runs at release-prep cadence
      # (docs/specs/polish-cost-reduction/, lever 1).
      - id: regenerate-help-templates
        name: Regenerate .help/templates for changed source files
        entry: uv run python scripts/regenerate_help_templates.py
        language: system
        pass_filenames: true
        files: ^(src/.*\.py|\.help/features\.yaml)$
        stages: [pre-commit]

      # Coverage exclusion policy enforcement
      # Every production-code entry in pyproject.toml's
      # [tool.coverage.run] omit block must have an inline `#` comment.
      # See docs/specs/coverage-exclusion-policy/.
      - id: check-coverage-omits
        name: Check coverage omit entries are documented
        entry: python scripts/check_coverage_omits.py
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
        stages: [pre-commit]

      # Deprecation marker enforcement
      # Modules tagged "REMOVE IN vX.Y.Z" must be removed before the
      # codebase ships major X. Fails when any marker has rotted past
      # the current major. See scripts/check_deprecation_markers.py.
      - id: check-deprecation-markers
        name: Check deprecation markers aren't past due
        entry: python scripts/check_deprecation_markers.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
        stages: [pre-commit]

      # Lessons corpus entry-form gate.
      # split_lessons() anchors on RAW "- **" lines; a bolded but
      # unbulleted entry is swallowed into the PRECEDING lesson and can
      # never be recalled on its own topic. The docs-outbox lint covers
      # artifacts swept in; this covers hand edits.
      - id: check-lessons-corpus
        name: Check lessons corpus entries are bulleted
        entry: python scripts/check_lessons_corpus.py
        language: system
        pass_filenames: false
        files: ^\.claude/lessons\.md$
        stages: [pre-commit]

      # Cross-provider collaboration contract drift gate (spec D3:
      # pre-commit here + CI via test_repo_projection_is_in_sync).
      # Edit content/collaboration/contract.md, then re-run
      # scripts/project_collaboration_contract.py.
      - id: check-collaboration-projection
        name: Check collaboration contract projection
        entry: python scripts/project_collaboration_contract.py --check
        language: system
        pass_filenames: false
        files: >-
          ^content/collaboration/contract\.md$|
          ^AGENTS\.md$|
          ^\.claude/CLAUDE\.md$|
          ^templates/agent-handoff\.md$|
          ^scripts/project_collaboration_contract\.py$
        stages: [pre-commit]

      # docs-link-prevalidation: flag unresolved cross-reference links
      # that attune-author's audit block already caught, before they
      # reach mkdocs --strict. v1 is WARN MODE — exits 0, prints
      # findings (DECIDE-1; promote to blocking by adding `return 1`
      # in the script after the warn-mode cycle). Override a file with
      # `<!-- attune-skip-link-check: <reason> -->`.
      - id: check-doc-audit-blocks
        name: Check docs/**/*.md for unresolved audit-block links (warn)
        entry: python scripts/check_doc_audit_blocks.py
        language: system
        files: ^docs/.*\.md$
        verbose: true
        stages: [pre-commit]

      # G5 (claim-drift-gates): stale-brand lint + empathy ratchet.
      # Hard-fails legacy identifiers; the empathy allowlist only
      # shrinks. The ONE gate D7 keeps in pre-commit (needs no
      # importable attune — pure git ls-files + text scan).
      - id: check-brand-drift
        name: Brand drift gate (G5 — legacy identifiers + empathy ratchet)
        entry: python scripts/check_brand_drift.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
