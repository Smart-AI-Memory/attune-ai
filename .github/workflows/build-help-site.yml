name: Build Help Site

# Regenerate the public help pages (attune-ai-dev/help/) from the
# .help/ corpus whenever the corpus or the build script changes.
# Eventual-rebuild policy (docs/specs/public-help-site/ D3): this
# auto-commits the regenerated pages on main; it never hard-fails on
# drift. Vercel serves the committed static files as-is.

on:
  push:
    branches: [main]
    paths:
      - ".help/**"
      - "attune-ai-dev/build_help.py"
      - "attune-ai-dev/brand.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-help-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # main requires PRs with no bypass allowances; the default
          # GITHUB_TOKEN (github-actions[bot]) cannot push to it (GH006).
          # ADMIN_MERGE_TOKEN is the owner's admin PAT, and enforce_admins
          # is off, so checking out with it lets the auto-commit push
          # bypass the PR requirement. persist-credentials keeps it set
          # for the later `git push`.
          token: ${{ secrets.ADMIN_MERGE_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install (core + markdown-it-py)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install markdown-it-py

      - name: Rebuild help pages
        run: python attune-ai-dev/build_help.py

      - name: Commit regenerated pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add attune-ai-dev/help
          if git diff --cached --quiet; then
            echo "help pages already up to date"
          else
            git commit -m "chore(help-site): rebuild help pages [skip ci]"
            # Another commit (e.g. a release PR merge) can land on main
            # while this run is mid-rebuild, making a plain push lose a
            # non-fast-forward race (! [rejected] main -> main). Rebase
            # onto the latest main and retry so the auto-commit survives
            # a concurrent merge.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main
              if git push; then
                echo "pushed on attempt $attempt"
                break
              fi
              echo "push attempt $attempt failed (main moved); retrying"
              if [ "$attempt" -eq 3 ]; then
                echo "push failed after 3 attempts" >&2
                exit 1
              fi
            done
          fi
