name: Integration Tests (auth)

# Opt-in WEEKLY run of the AUTH bucket of the integration suite
# (docs/specs/integration-coverage/): the 6 env-gated
# discovery_sweep files and test_llm_integration.py. (The 6 rotted
# `*_with_auth` demo files were retired 2026-06-10 after run
# 27249886475 — see auth-run-triage.md.) These hit the real
# Anthropic API with the repo's ANTHROPIC_API_KEY secret, so they
# NEVER run on push/PR — schedule + manual dispatch only (no
# pull_request trigger → no fork-PR secret exposure).
#
# Spend controls: ATTUNE_MAX_BUDGET_USD caps each SDK workflow run;
# per-test and job timeouts bound runaway runs; a post-run step reports
# this run's total telemetry cost to the job summary. Advisory job —
# failures are triage signal, not merge blockers.
#
# Known pre-existing issue this job will surface:
# test_llm_integration.py::test_thinking_mode hits the Opus-4.8
# max_tokens vs thinking.budget_tokens 400 (deprecated use_thinking
# path) — see docs/specs/integration-coverage/phase1-triage.md.

on:
  schedule:
    # Weekly Monday 07:00 UTC (~3 AM US Eastern). Was nightly; reduced
    # to weekly 2026-06-21 — the real SDK->API loop only changes on a
    # dep/SDK bump, so a daily paid canary was overspending. Trigger
    # manually via workflow_dispatch right after any claude-agent-sdk
    # or dep bump for an immediate live check.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-auth
  cancel-in-progress: false  # don't kill a half-finished paid run

jobs:
  integration-auth:
    name: integration (auth)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: DEC-8 spend gate — block if over the monthly ceiling
        # Enforcement half of the R6 spend alarm (see
        # scripts/ci_spend_gate.py). Needs ANTHROPIC_ADMIN_API_KEY to
        # verify spend; without it, fails open with a loud warning
        # rather than blocking every keyed run.
        env:
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
        run: python scripts/ci_spend_gate.py

      - name: Run auth integration bucket (real API)
        # -m "" / -o addopts="" override the repo defaults
        # (`-m "not integration"` and `-n auto`). Real-API workflow
        # tests run multi-minute each → 600 s per-test timeout; -n 2
        # keeps parallelism low to stay clear of API rate limits.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATTUNE_MAX_BUDGET_USD: "10"
        run: |
          pytest -m "" -o addopts="" -p no:cacheprovider \
            -n 2 --timeout=600 --timeout-method=thread \
            tests/integration -k "discovery_sweep or llm_integration"

      - name: Report API cost to job summary
        if: always()
        continue-on-error: true
        run: python scripts/ci_report_api_cost.py
