coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        # Chair-ruled 2026-07-20 ("floor 80, local 85" story): the
        # patch gate enforces the documented 80% changed-code floor.
        target: 80%
        threshold: 5%

ignore:
  - "docs/**"
  - "website/**"
  - "examples/**"
  - ".claude/**"
  - "benchmarks/**"
  - "scripts/**"
