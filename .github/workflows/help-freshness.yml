name: Help Freshness

# Report-only (polish-cost-reduction lever 1, 2026-06-10): the weekly
# schedule REPORTS staleness. Polish-bearing regeneration happens
# deliberately at release-prep cadence via `/coach maintain` (the
# absorbed attune.authoring generator). The in-CI regen path was
# retired 2026-07-27 with attune-author (author-consolidation T4).
on:
  schedule:
    # Sunday 12:00 UTC
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PyYAML

      - name: Check completeness
        run: |
          python scripts/check_help_completeness.py --format=json \
            > /tmp/completeness.json || true
          cat /tmp/completeness.json

      - name: List stale features
        id: list_stale
        run: |
          python scripts/list_stale_help_features.py \
            --help-dir .help --project-root . > /tmp/stale.txt
          echo "stale features:"
          cat /tmp/stale.txt || true
          count=$(wc -l < /tmp/stale.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Report staleness
        if: steps.list_stale.outputs.count != '0'
        run: |
          {
            echo "## Help freshness report (report-only)"
            echo
            echo "Stale features:"
            sed 's/^/- /' /tmp/stale.txt
            echo
            echo "Regenerate deliberately at release-prep via /coach maintain."
          } >> "$GITHUB_STEP_SUMMARY"
