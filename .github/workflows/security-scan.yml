name: Security Audit (blocking)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
  workflow_dispatch:

concurrency:
  # Literal group id, deliberately NOT ${{ github.workflow }} — see the same
  # comment in security.yml. This workflow blocks on critical findings, so a
  # name collision silently cancelling it is a security hole, not a cosmetic
  # CI annoyance. Keep these literals unique per file.
  group: security-attune-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security-scan:
    name: Run Security Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for better context

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security audit
        id: security_scan
        continue-on-error: true  # Retain diagnostics; the always-run check fails incomplete scans
        env:
          # Non-interactive CI run — opt into the spend gate explicitly
          # (collaboration-gates D10). Without this the gate would block
          # the run by default in a context that can't confirm.
          ATTUNE_SPEND_GATE_AUTHORIZED: "1"
        run: |
          # Run security audit and capture raw output
          # --json flag outputs JSON but CLI also prints rich text (progress, panels)
          # Capture everything, then extract JSON in post-processing
          # Capture failure under bash -e instead of losing the scanner's exit code.
          scan_exit=0
          attune workflow run security-audit --json > security_results_raw.txt 2>security_scan_stderr.log || scan_exit=$?
          echo "scan_exit=$scan_exit" >> "$GITHUB_OUTPUT"

          # Extract JSON from mixed output (CLI prints rich text before JSON result)
          # Only the findings-list contract consumed by the analyzer is supported.
          # An SDK envelope or malformed output cannot establish zero findings.
          results_exit=0
          python3 - <<'PY' || results_exit=$?
          import json
          import sys
          from pathlib import Path

          content = Path('security_results_raw.txt').read_text(encoding='utf-8')
          data = None
          try:
              data = json.loads(content)
          except json.JSONDecodeError:
              # The CLI prints its JSON object at column 0. Do not recover a
              # nested suffix from an invalid outer object or skip trailing data.
              decoder = json.JSONDecoder()
              for start, char in enumerate(content):
                  if char != '{' or (start and content[start - 1] != '\n'):
                      continue
                  try:
                      candidate, end = decoder.raw_decode(content, start)
                  except json.JSONDecodeError:
                      break
                  if not content[end:].strip():
                      data = candidate
                  break

          valid = (
              isinstance(data, dict)
              and isinstance(data.get('findings'), list)
              and all(
                  isinstance(finding, dict)
                  and isinstance(finding.get('severity', 'low'), str)
                  and finding.get('severity', 'low').lower() in ('critical', 'medium', 'low')
                  for finding in data['findings']
              )
              and 'error' not in data
              and not data.get('scan_skipped')
              and data.get('success', True) is True
              and type(data.get('exit_code', 0)) is int
              and data.get('exit_code', 0) == 0
          )
          if not valid:
              data = {'findings': [], 'error': 'Could not extract JSON from CLI output'}
          Path('security_results.json').write_text(json.dumps(data, indent=2), encoding='utf-8')
          sys.exit(0 if valid else 1)
          PY

          # Check if scan succeeded
          if [ "$scan_exit" -eq 0 ] && [ "$results_exit" -eq 0 ]; then
            echo "scan_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "scan_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Ensure results file exists
        if: always()
        run: |
          if [ ! -f security_results.json ]; then
            echo '{"findings": [], "error": "Security scan produced no output"}' > security_results.json
          fi

      - name: Parse and analyze results
        id: analyze
        run: |
          python .github/scripts/analyze_security_results.py \
            --input security_results.json \
            --output analysis.json \
            --github-output $GITHUB_OUTPUT

      - name: Post results to PR
        # Skip when extraction failed (no pr_comment.md written) — see issue #560.
        # Incomplete scans fail the always-run check below, without a passed PR comment.
        if: github.event_name == 'pull_request' && steps.security_scan.outcome == 'success' && steps.security_scan.outputs.scan_status == 'success' && hashFiles('pr_comment.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('analysis.json', 'utf8'));

            // Read the formatted comment
            const comment = fs.readFileSync('pr_comment.md', 'utf8');

            // Find existing security scan comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🔒 Security Scan Results')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Check for bypass label
        if: github.event_name == 'pull_request'
        id: check_bypass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const bypassLabels = ['security-scan-bypass', 'hotfix', 'security-approved'];
            const hasBypass = pr.labels.some(label => bypassLabels.includes(label.name));

            console.log(`Has bypass label: ${hasBypass}`);
            core.setOutput('has_bypass', hasBypass);

            return hasBypass;

      - name: Block on critical findings
        if: steps.analyze.outputs.has_critical == 'true' && steps.check_bypass.outputs.has_bypass != 'true'
        run: |
          echo "❌ CRITICAL security issues found!"
          echo ""
          echo "Found ${{ steps.analyze.outputs.critical_count }} CRITICAL security finding(s)."
          echo "These must be fixed before merging."
          echo ""
          echo "If this is a false positive, you can:"
          echo "1. Add a security note comment in the code"
          echo "2. Request security team review by adding 'security-review' label"
          echo "3. For emergencies, add 'hotfix' label (requires post-deploy fix)"
          echo ""
          echo "See PR comment for detailed findings."
          exit 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-results
          path: |
            security_results_raw.txt
            security_results.json
            security_scan_stderr.log
            analysis.json
            pr_comment.md
          retention-days: 90

      - name: Create check run
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.security_scan.outcome }}
          SCAN_STATUS: ${{ steps.security_scan.outputs.scan_status }}
          SCAN_EXIT: ${{ steps.security_scan.outputs.scan_exit }}
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let analysis = {};
            let analysisError = '';
            try {
              analysis = JSON.parse(fs.readFileSync('analysis.json', 'utf8'));
              if (!analysis || typeof analysis !== 'object' || Array.isArray(analysis)) {
                throw new Error('Analysis must be an object');
              }
            } catch (error) {
              analysis = {};
              analysisError = `Missing or invalid analysis.json: ${error.message}`;
            }

            const validCounts = ['total_findings', 'critical_count', 'medium_count', 'low_count']
              .every(key => Number.isInteger(analysis[key]) && analysis[key] >= 0);
            const scanComplete = process.env.SCAN_OUTCOME === 'success'
              && process.env.SCAN_STATUS === 'success'
              && process.env.SCAN_EXIT === '0'
              && process.env.ANALYSIS_OUTCOME === 'success'
              && validCounts
              && analysis.total_findings === analysis.critical_count + analysis.medium_count + analysis.low_count
              && typeof analysis.has_critical === 'boolean'
              && typeof analysis.has_bypass === 'boolean'
              && analysis.has_critical === (analysis.critical_count > 0)
              && !analysisError && !('error' in analysis) && !analysis.scan_skipped;
            const diagnostic = analysisError || analysis.error
              || `Scanner exit: ${process.env.SCAN_EXIT || 'unavailable'}; scan: ${process.env.SCAN_OUTCOME || 'unavailable'}; analysis: ${process.env.ANALYSIS_OUTCOME || 'unavailable'}`;
            if (!scanComplete) {
              // Fail the job as well as its payload, even if publishing the check fails.
              core.setFailed(`Security scan incomplete: ${diagnostic}`);
            }

            const conclusion = !scanComplete || (analysis.has_critical && !analysis.has_bypass) ? 'failure' : 'success';
            const summary = scanComplete ? `
            ## Security Scan Summary

            - **Total Findings:** ${analysis.total_findings}
            - **Critical:** ${analysis.critical_count}
            - **Medium:** ${analysis.medium_count}
            - **Low:** ${analysis.low_count}

            ${conclusion === 'failure' ? '❌ **BLOCKED:** Critical findings must be resolved' : '✅ No blocking issues'}
            ` : `## Security Scan Incomplete\n\nFindings are unavailable; this is not a zero-findings result.\n\n${diagnostic}`;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security Scan',
              head_sha: context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: !scanComplete ? 'Security Scan Incomplete' : conclusion === 'failure' ? 'Critical Security Issues Found' : analysis.total_findings === 0 ? 'Security Scan Completed — No Findings' : 'Security Scan Passed',
                summary: summary,
                text: !scanComplete ? diagnostic : analysis.detailed_text || 'See PR comment for details'
              }
            });
