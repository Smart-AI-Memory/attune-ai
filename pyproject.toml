[project.scripts]
# Primary minimal CLI (v4.7.1+) - streamlined for automation/CI
attune = "attune.cli_minimal:main"

# Legacy entry points removed in v2.6.2 (was empathy-*)
# Use 'attune' CLI instead

[project.urls]
Homepage = "https://attune-ai.dev"
Documentation = "https://www.smartaimemory.com/framework-docs/"
"Getting Started" = "https://www.smartaimemory.com/framework-docs/tutorials/quickstart/"
FAQ = "https://www.smartaimemory.com/framework-docs/reference/FAQ/"
Repository = "https://github.com/Smart-AI-Memory/attune-ai"
Issues = "https://github.com/Smart-AI-Memory/attune-ai/issues"
Discussions = "https://github.com/Smart-AI-Memory/attune-ai/discussions"
Changelog = "https://github.com/Smart-AI-Memory/attune-ai/blob/main/CHANGELOG.md"

# pytest plugin: pin the cryptography PyO3 extension once at startup so
# serial `pytest --cov=attune.memory.*` runs don't re-init `_rust` and
# disable encryption. See src/attune/_pytest_crypto_pin.py for the full
# root-cause writeup.
[project.entry-points.pytest11]
attune_crypto_pin = "attune._pytest_crypto_pin"

# Plugin entry points for auto-discovery
[project.entry-points."attune.plugins"]
software = "attune_software.plugin:SoftwarePlugin"
redis = "attune_redis.plugin:RedisPlugin"

# Backward-compat alias (removed in v3.0.0)
[project.entry-points."empathy_framework.plugins"]
software = "attune_software.plugin:SoftwarePlugin"

# Workflow plugin entry points for auto-discovery
[project.entry-points."attune.workflows"]
code-review = "attune.workflows.code_review:CodeReviewWorkflow"
doc-gen = "attune.workflows.document_gen:DocumentGenerationWorkflow"
bug-predict = "attune.workflows.bug_predict:BugPredictionWorkflow"
# Superseded by wizards — kept for backward compatibility until migration
security-audit = "attune.workflows.security_audit:SecurityAuditWorkflow"
perf-audit = "attune.workflows.perf_audit:PerformanceAuditWorkflow"
test-gen = "attune.workflows.test_gen:TestGenerationWorkflow"
test-audit = "attune.workflows.test_audit:TestAuditWorkflow"
refactor-plan = "attune.workflows.refactor_plan:RefactorPlanWorkflow"
dependency-check = "attune.workflows.dependency_check:DependencyCheckWorkflow"
# v5.2 Agent team (replaces CrewAI-based crew)
release-prep = "attune.agents.release.release_prep_team:ReleasePrepTeamWorkflow"
# health-check: removed in v2.9.0 (module deleted, use release-prep workflow instead)
# test-coverage-boost: removed (module deleted, use test-gen workflow instead)
# Legacy entry points removed - handled by migration system
# (release-prep-legacy → release-prep, health-check-legacy → health-check)
# Other workflows
doc-audit = "attune.workflows.doc_audit:DocAuditWorkflow"
secure-release = "attune.workflows.secure_release:SecureReleasePipeline"
# pro-review: Consolidated into code-review (migration.py)
# pr-review: Consolidated into code-review (migration.py)

# Wizard entry points for auto-discovery
[project.entry-points."attune.wizards"]
debug = "attune.wizards.builtin.debug_wizard:DebugWizard"
test-gen = "attune.wizards.builtin.test_gen_wizard:TestGenWizard"
refactor = "attune.wizards.builtin.refactor_wizard:RefactorWizard"
security = "attune.wizards.builtin.security_wizard:SecurityWizard"
release-prep = "attune.wizards.builtin.release_prep_wizard:ReleasePrepWizard"

# Memory backend plugin entry points
[project.entry-points."attune.memory_backends"]
file = "attune.memory.file_stash:FileStashBackend"
redis = "attune_redis.memory:AMSMemoryBackend"

[tool.setuptools]
# Automatic package discovery
[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false
exclude = ["tests*", "*.tests*", "examples*", "docs*", "*.archive*", "build*", "dist*", "archived_wizards*", "wizards_consolidated*", "*.mypy_cache*", "*.__pycache__*"]

[tool.setuptools.package-dir]
attune = "src/attune"

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.txt", "*.md", "*.jinja2"]
"attune.commands" = ["*.md"]
"attune.commands.agents" = ["*.md"]
"attune.ops" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

# Black code formatter configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py310"
fix = true  # Auto-fix safe issues
exclude = [
    "website/",  # Next.js website - separate linting
    "docs/archive/",  # Archived code
    "examples/",  # Example code
    "deployments/",  # Deployment scripts
    ".archive/",  # Archived files
    "src/attune/workflows/new_sample_workflow1.py",  # Test workflow
    "src/attune/workflows/test5.py",  # Test workflow
    "benchmarks/",  # Benchmark and test scripts
    "test_generator/",  # Test generator tools
    "workflow_patterns/",  # Experimental workflow patterns
    "workflow_scaffolding/",  # Workflow scaffolding tools
    "scripts/",  # Build and release scripts
    "services/",  # Service layer (external)
    "vscode-extension/",  # VSCode extension code
    "vscode-memory-panel/",  # VSCode memory panel
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "BLE",  # flake8-blind-except (catch bare except: clauses)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    # B904 removed from ignore list — all violations fixed, now enforced
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["attune", "attune_software"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"test_*.py" = ["BLE001"]  # Test files can catch broad exceptions
"*_test.py" = ["BLE001"]  # Test files can catch broad exceptions
"tests/**/*.py" = ["BLE001", "B017"]  # Test files can catch/assert broad exceptions
"agents/**/*.py" = ["BLE001"]  # Agent files need broad exception handling for resilience
"backend/**/*.py" = ["BLE001", "E402"]  # Backend files need broad exception handling
"*_wizard.py" = ["BLE001"]  # Wizard files need broad exception handling
"*_agent.py" = ["BLE001"]  # Agent files need broad exception handling
# attune_llm removed in v2.9.0
"src/attune/**/*.py" = ["BLE001"]  # Core framework needs broad exception handling
"*_adapter.py" = ["BLE001"]  # Adapter files need broad exception handling
"*_crew.py" = ["BLE001"]  # Crew files need broad exception handling
"deployments/**/*.py" = ["BLE001"]  # Deployment scripts need broad exception handling
"docs/archive/**/*.py" = ["BLE001"]  # Archived code
"attune_software/**/*.py" = ["BLE001"]  # Plugin needs broad exception handling
"examples/**/*.py" = ["BLE001"]  # Examples can use broad exception handling
"demo_*.py" = ["BLE001"]  # Demo files can use broad exception handling
"benchmark_*.py" = ["BLE001"]  # Benchmark scripts need broad exception handling for error reporting
"profile_*.py" = ["BLE001"]  # Profiling scripts need broad exception handling
"run_*.py" = ["BLE001"]  # Manual test runner scripts
"manual_*.py" = ["BLE001"]  # Manual test scripts
"benchmarks/**/*.py" = ["BLE001"]  # Benchmark directory - broad exception handling for test/benchmark scripts

"test_generator/**/*.py" = ["BLE001"]  # Test generator - development tools
"workflow_patterns/**/*.py" = ["BLE001"]  # Workflow patterns - development/experimental
"workflow_scaffolding/**/*.py" = ["BLE001"]  # Workflow scaffolding - development tools
"scripts/**/*.py" = ["BLE001"]  # Build and release scripts need broad exception handling
"services/**/*.py" = ["BLE001"]  # Service layer needs broad exception handling
"vscode-extension/**/*.py" = ["BLE001"]  # VSCode extension scripts
"vscode-memory-panel/**/*.py" = ["BLE001"]  # VSCode memory panel scripts

# MyPy type checker configuration
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
exclude = [
    "10_9_2025_ai_nurse_florence/",
    "anthropic-cookbook/",
    "salvaged/",
    "site/",
    "ebook-site/",
    "website/",
    "agents/",  # Root-level agents dir (not part of main packages)
    "examples/",  # Example scripts (not part of main packages)
    "src/",  # Exclude src/ as top-level package (use via mypy_path instead)
    "build/",  # Build artifacts
    "backend/",  # Backend service (separate project)
    "scripts/",  # Utility scripts (not production code)
    "docs/",  # Documentation scripts
    "book-indesign/",  # Book publishing scripts
    "archived_wizards/",  # Archived code
    "wizards_consolidated/",  # Consolidated wizards (separate)
    "coach_wizards/",  # Coach wizards (separate package)
    "tests/test_wizard_site_comprehensive.py",  # Large test file
    "tests/test_plugin_registry.py",  # Mock-heavy test file
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# test_generator has mock issues with __file__ attribute — needs rewrite.
norecursedirs = [
    "tests/unit/test_generator",
]
addopts = [
    "--verbose",
    "--cov=attune",
    "--cov=attune_software",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "--asyncio-mode=auto",
    # Stale ignores removed in v2.9.0 (test files deleted)
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security-focused",
    "performance: marks tests as performance benchmarks",
    "llm: marks tests that require LLM API access",
    "network: marks tests that require network/internet access (skip in CI with '-m \"not network\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["attune", "attune_software"]

# Coverage exclusion policy — see docs/specs/coverage-exclusion-policy/.
# Every production-code entry below MUST have an inline `#` comment
# stating the reason. Reason should fit one of the categories in
# requirements.md: interactive CLI, infrastructure server, live
# service required, deprecated, optional adapter, standalone script,
# example/demo, or justified-other. Meta-excludes (test discovery
# patterns, build artifacts, third-party paths) do not need comments.
# Future enforcement: scripts/check_coverage_omits.py (Phase 3C).
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    # Deprecated/Example modules excluded from coverage (v4.4.0)
    "*/agent_factory/crews/*",  # CrewAI deprecated - use meta-workflows
    "*/agent_factory/adapters/autogen_adapter.py",  # Deprecated adapter
    "*/agent_factory/adapters/crewai_adapter.py",  # CrewAI deprecated
    "*/agent_factory/adapters/haystack_adapter.py",  # Deprecated adapter
    "*/agent_factory/adapters/langchain_adapter.py",  # Use native adapter
    "*/agent_factory/memory_integration.py",  # Optional integration module
    "*/agent_factory/resilient.py",  # Optional resilience module
    "*/*_example.py",  # Example files
    # Utility modules with low criticality
    "*/utils/tokens.py",  # Token utilities
    "*/memory/security/audit_logger.py",  # Optional audit logging
    # Wizard examples (not core functionality)
    "*/wizards/technology_wizard.py",  # Example wizard
    "*/wizards/customer_support_wizard.py",  # Example wizard
    # Infrastructure servers (require HTTP/WebSocket clients, not unit-testable)
    "*/mcp/server.py",  # MCP protocol server
    "*/workflows/progress_server.py",  # Progress streaming server
    # Interactive CLIs (require TTY/user input)
    "*/models/auth_cli.py",  # Interactive auth setup
    "*/monitoring/alerts_cli.py",  # Monitoring CLI
    # Deprecated modules
    # release_prep_crew.py omit entry removed — file was deleted.
    # Legacy/alternative CLIs
    "attune_software/cli/*.py",  # Plugin CLI subcommands
    # Infrastructure requiring external deps
    # Deleted in v2.9.0: cli/, cli_unified.py, security/, pattern modules
    # Memory modules requiring Redis server
    "*/memory/cross_session.py",  # Requires Redis server
    "*/memory/control_panel_api.py",  # FastAPI REST server
    "*/memory/short_term/sessions.py",  # Requires Redis server
    "*/memory/claude_memory.py",  # Requires Claude API
    # Agent modules requiring live LLM
    "*/agents/release/release_prep_team.py",  # Requires LLM API calls
    # OpenTelemetry backend (requires otel infrastructure)
    "*/monitoring/otel_backend.py",  # Requires OpenTelemetry SDK
    # Orchestration execution (requires external services)
    "*/orchestration/execution_strategies.py",  # Requires live agents
    "*/orchestration/_strategies/base.py",  # Abstract base strategies
    # Meta-workflow CLI commands (interactive)
    "*/meta_workflows/cli_meta_workflows.py",  # CLI entry
    "*/meta_workflows/cli_commands/analytics_commands.py",  # Interactive analytics
    "*/meta_workflows/cli_commands/template_commands.py",  # Interactive templates
    "*/meta_workflows/cli_commands/config_commands.py",  # Interactive config
    "*/meta_workflows/cli_commands/memory_commands.py",  # Interactive memory
    # Hook scripts (run as standalone processes via Claude Code)
    "*/hooks/scripts/evaluate_session.py",  # Standalone hook
    "*/hooks/scripts/first_time_init.py",  # Standalone hook
    "*/hooks/scripts/session_end.py",  # Standalone hook
    "*/hooks/scripts/session_start.py",  # Standalone hook
    "*/hooks/scripts/suggest_compact.py",  # Standalone hook
    "*/hooks/scripts/telemetry_hook.py",  # Standalone hook
    # Core module stubs
    "*/core_modules/interaction.py",  # Interaction stubs
    "*/core_modules/short_term_memory.py",  # Memory stubs
    # MCP init
    "*/mcp/__init__.py",  # MCP package init
    # Project index (requires filesystem scanning)
    "*/project_index/index.py",  # Full project indexing (integration-tested)
    "*/project_index/scanner_parallel.py",  # Parallel scanner (requires multiprocessing)
    # Commands module init
    "*/commands/__init__.py",  # Commands package init
    # Storage init
    "*/memory/storage/__init__.py",  # Storage package init
    # Core modules init
    "*/core_modules/__init__.py",  # Core modules init
    # Models main entry
    "*/models/__main__.py",  # Models CLI entry point
    "*/hooks/scripts/help_freshness_nudge.py",  # Standalone hook script (not importable via pytest)
    "*/meta_workflows/cli_commands/agent_commands.py",  # Interactive agent CLI (requires live Claude agent loop)
    "*/attune/config.py",  # Shadowed by attune/config/ package — unreachable import
]
branch = true
# parallel + concurrency: ensure xdist workers flush coverage data
# to per-worker `.coverage.<host>.<pid>` files instead of holding
# everything in memory until suite end. Combined with the CI-only
# `-n 1` cap in .github/workflows/tests.yml this keeps CI memory
# well under the 16 GB Linux / 7 GB macOS ceilings (measured peak
# 1.5 GB on iter 4 of PR #212). These settings are safe in local
# dev too.
#
# NOTE: branch coverage was briefly disabled in PR #212 commit
# b43f6803 on the theory that it caused the OOM. Memory data from
# iter 4 (commit d4f33ddd, `-n 1` sequential) showed peak RAM at
# 1.5 GB — branch coverage was never the OOM driver. Re-enabling
# because the real OOM cause was xdist worker multiplication, now
# capped at 1 worker in CI, and because turning branch off dropped
# the reported total coverage from 87.70% to 81.66%, tripping
# --cov-fail-under=85 with what looked like worker crashes
# (actually pytest-cov killing workers on coverage-gate failure).
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Coverage threshold — bumped to 85% (actual: 87.70%)
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Sibling repos — all published to PyPI:
#   attune-rag     — core dep (>=0.1.5,<0.8) — promoted from optional; required for accuracy
#   attune-verify  — core dep (>=0.1.0,<0.3) — backs /verify; stdlib-only, zero transitive deps
#   attune-author  — [author] optional extra (>=0.21.0,<0.22)
#   attune-rag     — [rag] optional extra (>=0.1.5,<0.8) — no-op alias since rag is core
#
# No [tool.uv.sources] overrides needed: CI resolves all three
# from PyPI (https://pypi.org/simple). For local iteration against
# an in-flight sibling change, use `uv pip install -e
# ../attune-<name>/` to shadow the PyPI version inside the venv.
# Do NOT add a `path = "../attune-<name>", editable = true` entry
# here unless you're ready to either (a) publish that version to
# PyPI before merging, or (b) ensure CI checks out the sibling
# repo alongside this one. An unresolvable editable path in
# uv.lock fails every `uv sync` in CI under the "Failed to
# generate package metadata for ... editable+../..." error.
