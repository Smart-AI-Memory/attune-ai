name: Test attune-redis plugin

on:
  push:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  pull_request:
    paths:
      - 'attune_redis/**'
      - '.github/workflows/test-attune-redis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis,dev]"

      - name: Run plugin unit tests
        run: |
          python -m pytest attune_redis/tests/ -v \
            --ignore=attune_redis/tests/test_integration.py

      - name: Run protocol compliance tests
        run: |
          python -m pytest tests/unit/memory/test_memory_backend_protocol.py -v
