# Site Information
site_name: Attune AI
site_description: AI-powered developer workflows with cost optimization and multi-agent orchestration. Built exclusively for Anthropic Claude.
site_author: Patrick Roebuck
site_url: https://smartaimemory.com/framework-docs/

# Repository
