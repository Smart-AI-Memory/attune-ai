    # [ops] extra above.
    "uvicorn[standard]>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "requests>=2.28.0,<3.0.0",  # For notification tests
    # RAG integration test coverage — attune-rag is an
