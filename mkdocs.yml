# Theme Configuration (Material)
theme:
  name: material
  custom_dir: docs/overrides

  # Color scheme
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  # Logo and favicon
  logo: assets/images/empathy-brain-logo.png
  favicon: assets/images/empathy-brain-logo.png

  # Font
  font:
    text: Roboto
    code: Roboto Mono

# Build hooks
# feature_nav.py injects the top-level "Features" nav section from
# docs/features/*.md hub pages (D12) — one nav entry per feature, so the
# single-source rollout never edits this file per feature.
hooks:
  - docs/hooks/feature_nav.py

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, .]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

