name: Security Audit (blocking)

# The controller is trusted main code. It never checks out or executes PR code.
# A missing, failed, expired or incomplete exact-commit manual audit stays red.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
  workflow_run:
    workflows: ['Security audit (approved manual run)']
    types: [requested, in_progress, completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: security-attune-audit-${{ github.event.pull_request.head.sha || fromJSON(github.event.workflow_run.display_title || '{"sha":"none"}').sha }}
  cancel-in-progress: false

jobs:
  security-scan:
    name: Verify SDK audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify manual audit evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
        run: python3 -I .github/scripts/verify_manual_security_audit.py
