<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Three shapes of a prompt</title>
  <desc id="d">A one-shot, an XML-enhanced task, and a spec whose ladder of tasks are XML-enhanced prompts. Enhanced prompts gather what is missing before any shape is written; dynamic forms carry the questions.</desc>
  <rect width="1200" height="630" fill="#FAF9F5"/>
  <text x="600" y="72" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="500" fill="#2C2C2A">Three shapes of a prompt</text>
  <text x="600" y="106" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#5F5E5A">same request, sized to its consequence, ambiguity, dependency and continuity</text>

  <!-- Shape 1: one-shot -->
  <g>
    <rect x="60" y="170" width="300" height="230" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
    <text x="210" y="208" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">1 · Structured one-shot</text>
    <text x="210" y="240" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">one session, one clear result</text>
    <rect x="90" y="262" width="240" height="112" rx="8" fill="#FFFFFF" stroke="#D9D7CF"/>
    <text x="104" y="286" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">goal</text>
    <text x="104" y="308" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">context</text>
    <text x="104" y="330" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">constraints</text>
    <text x="104" y="352" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">acceptance criteria</text>
  </g>

  <!-- Shape 2: XML task -->
  <g>
    <rect x="450" y="170" width="300" height="230" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
    <text x="600" y="208" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">2 · XML-enhanced task</text>
    <text x="600" y="240" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">a cold handoff another agent can run</text>
    <rect x="480" y="262" width="240" height="112" rx="8" fill="#FFFFFF" stroke="#D9D7CF"/>
    <text x="494" y="286" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">&lt;objective&gt;</text>
    <text x="494" y="308" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">&lt;files-to-modify&gt;</text>
    <text x="494" y="330" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">&lt;validation&gt;</text>
    <text x="494" y="352" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2C2C2A">&lt;risks&gt;</text>
  </g>

  <!-- Shape 3: spec ladder -->
  <g>
    <rect x="840" y="170" width="300" height="230" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
    <text x="990" y="208" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">3 · Spec (Spec Ladders)</text>
    <text x="990" y="240" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">decisions recorded, tasks gated</text>
    <rect x="870" y="262" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#D9D7CF"/>
    <text x="884" y="282" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#2C2C2A">requirements · decisions</text>
    <rect x="870" y="300" width="240" height="24" rx="6" fill="#FFFFFF" stroke="#D9D7CF"/>
    <text x="884" y="317" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2C2C2A">&lt;task id="1"&gt; … &lt;/task&gt;</text>
    <rect x="870" y="330" width="240" height="24" rx="6" fill="#FFFFFF" stroke="#D9D7CF"/>
    <text x="884" y="347" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2C2C2A">&lt;task id="2"&gt; … &lt;/task&gt;</text>
    <text x="990" y="376" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">each task is shape 2, approved in order</text>
  </g>

  <!-- arrows between shapes -->
  <g stroke="#8A887F" stroke-width="2" fill="none">
    <path d="M362 285 L446 285"/><path d="M438 279 L446 285 L438 291"/>
    <path d="M752 285 L836 285"/><path d="M828 279 L836 285 L828 291"/>
  </g>
  <text x="404" y="272" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">grows when</text>
  <text x="404" y="304" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">handed off</text>
  <text x="794" y="272" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">grows when</text>
  <text x="794" y="304" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">decisions recur</text>

  <!-- the two features underneath -->
  <rect x="60" y="440" width="520" height="140" rx="14" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="320" y="476" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="500" fill="#2C2C2A">Enhanced prompts</text>
  <text x="320" y="504" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">uses what you already said · asks only material unknowns</text>
  <text x="320" y="526" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">folds terse answers and corrections into the working prompt</text>
  <text x="320" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8A887F">default on · [no-refine] · attune config set prompt_refinement false</text>

  <rect x="620" y="440" width="520" height="140" rx="14" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="880" y="476" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="500" fill="#2C2C2A">Dynamic forms</text>
  <text x="880" y="504" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">several independent unknowns become one answerable turn</text>
  <text x="880" y="526" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5F5E5A">recommendations, pushback and assumptions as cards you pick from</text>
  <text x="880" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8A887F">validated once · widget, native question, or typed reply</text>

  <path d="M600 400 L600 440" stroke="#8A887F" stroke-width="2" fill="none"/>
  <rect x="502" y="412" width="196" height="18" rx="4" fill="#FAF9F5"/>
  <text x="600" y="425" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5F5E5A">both features work on every shape</text>
</svg>
