[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attune-ai"
version = "9.3.0"
description = "AI-powered developer workflows for Claude with cost optimization, multi-agent orchestration, and workflow automation."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Patrick Roebuck", email = "admin@smartaimemory.com"}
]
maintainers = [
    {name = "Smart-AI-Memory", email = "admin@smartaimemory.com"}
]
keywords = [
    "ai",
    "claude",
    "anthropic",
    "llm",
    "ai-agent",
    "multi-agent",
    "developer-tools",
    "code-review",
    "security-audit",
    "test-generation",
    "workflow-automation",
    "cost-optimization",
    "claude-code",
    "mcp",
    "model-context-protocol",
    "static-analysis",
    "code-quality",
    "devops",
    "ci-cd",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]

# Core dependencies - minimal required for framework to function
# DESIGN: Keep core lightweight for fast installs. Heavy deps are optional.
dependencies = [
    "pydantic>=2.4.0,<3.0.0",
    "typing-extensions>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=24.0.0,<27.0.0",
    "defusedxml>=0.7.0,<1.0.0",
    "rich>=13.0.0,<16.0.0",  # Beautiful CLI output
    "typer>=0.9.0,<1.0.0",  # Better CLI commands
    "pyyaml>=6.0,<7.0",  # Required by workflows (bug_predict, etc.)
    "anthropic>=0.40.0,<1.0.0",  # Core LLM provider (direct SDK usage)
    "claude-agent-sdk>=0.2.101,<0.3.0",  # Agents SDK for workflow execution. Floor >=0.2.101 admits list_subagents/get_subagent_messages (transcript recovery) + TaskBudget (token-aware pacing). 0.2.x adopted deliberately 2026-06-16 (docs/specs/claude-agent-sdk-0-2-migration): the 0.1->0.2 behavioral breaks (MCP background-connection default, TodoWrite->Task tools, system-prompt default) do NOT affect attune — workflows pass no mcp_servers, never use TodoWrite, and set setting_sources=[] everywhere (sdk-subprocess-isolation) which already suppresses the Claude Code system prompt. Full keyless unit suite green (17857 passed) against 0.2.102. Ceiling <0.3.0 holds back the next major's breaking changes from a routine `uv lock --upgrade`; lockfile is at 0.2.105 (0.2.102's bundled CLI 2.1.178 emitted is_error-on-success, breaking integration-auth; 0.2.105 bundles CLI 2.1.183 which returns is_error:false on success — verified 2026-06-20). Remove the cap deliberately when adopting 0.3.x.
    "mcp>=1.23.0",  # MCP runtime — imported directly by attune.mcp.server (Server/stdio/types). Declared explicitly (was transitive via claude-agent-sdk) to pin the >=1.23.0 security floor; lockfile is at 1.27.0.
    "python-multipart>=0.0.26",  # Pin above GHSA-59g5-xgcq-4qw3 / GHSA-wp53-j4wj-2cfg / CVE-2026-40347 (transitive via mcp)
    "cryptography>=46.0.7",  # CVE-2026-39892 (transitive via PyJWT[crypto])
    "langsmith>=0.7.31,<2.0.0",  # GHSA-rr7j-v2q5-chgv (transitive via langchain-core)
    "jinja2>=3.1.0,<4.0.0",  # Meta template rendering for help system
    "python-frontmatter>=1.0.0,<2.0.0",  # YAML frontmatter parsing for help templates — required by attune.help.engine which backs the help_lookup MCP tool (progressive/workflow_help/precursor/search_tag modes all parse template files). Vanilla pip install attune-ai without this breaks every help_lookup mode except `preamble`.
    "attune-rag>=0.1.5,<0.8",  # RAG grounding for rag-code-gen workflow + rag_knowledge_query MCP tool. Core dep (not optional) — required for acceptable retrieval accuracy. Cap is <0.8: re-validated against attune-rag 0.7.0 (lock bumped 0.6.0->0.7.0; purely additive — subscription-first FaithfulnessJudge auth + new attune_rag.auth module; only removal is the internal Phase-4 freeze CI gate, "no library change"; all 0.6.x public symbols unchanged per its POLICY §2, confirmed by importing every attune-ai-consumed symbol); next minor (0.8.0) still requires explicit re-validation before lifting the cap.
    "attune-verify>=0.1.0,<0.3",  # Generation fact-checker backing the /verify skill (deterministic entity checks: imports/flags/links/counts). Core dep — stdlib-only (zero transitive deps), so promoting to core is cheap and lets /verify work out of the box without an extra. Semantic layer is opt-in (the skill acts as the ambient judge). Cap raised to <0.3 to admit 0.2.0 (full dotted-path import resolution — catches private-submodule hallucinations the 0.1.0 top-level-only checker missed; purely additive, no API break).
    "tomli>=2.0.0; python_version < '3.11'",  # tomllib fallback for Python 3.10. Used by attune.utils.coverage (loaded transitively from release-prep + orchestrated-health-check workflows). Without this, those workflows fail to load on 3.10.
    # NOTE: attune-author is a workspace-only dev dep for authoring/
    # refactoring help content — NOT a runtime requirement.
    # NOTE: redis is opt-in via the [redis] extra (bundled attune_redis
    # plugin). Vanilla `pip install attune-ai` is Redis-free.
]
# NOTE: CrewAI dependency removed in v3.1.3 (deprecated since v4.4.0)
# The "Crew" workflows use EmpathyLLMExecutor (Anthropic SDK) directly.

[project.optional-dependencies]
# attune-rag promoted to core dep in v3.x (required for acceptable accuracy).
# The [rag] extra is kept as a no-op alias for backward compat with any
# install scripts that used `pip install attune-ai[rag]`.
rag = []

# Help authoring (generate / regenerate / polish the
# project's own `.help/` templates). Optional because
# most consumers of attune-ai don't edit help content.
# Local devs working on attune-ai itself should install
# this — it backs the `help_maintain` MCP tool and lets
# the `attune-author` CLI run inside this venv without
# a sibling checkout. `[tool.uv.sources]` (below) routes
# to the sibling path for workspace dev; PyPI is the
# fallback.
author = [
    "attune-author>=0.21.0,<0.23",
    # attune-author 0.15.0 moved attune-help from its core deps to its
    # dev extra — attune-ai had been receiving it TRANSITIVELY. The
    # rag_knowledge_query MCP tool and help-corpus tests need it, so
    # pin it explicitly here rather than ride resolution luck.
    "attune-help>=0.10.0",
]

# `[memory]` extra removed in v6.8.0 (P2 of redis-decoupling spec).
# It was redundant with `[redis]` — both pulled `redis-py`. Empty no-op
# kept for backward compat with `pip install 'attune-ai[memory]'`; users
# who actually want Redis should use `[redis]` (canonical opt-in for the
# bundled attune_redis plugin).
memory = []

# Redis Agent Memory Server runtime deps for the bundled `attune_redis`
# plugin. Opt-in only — vanilla `pip install attune-ai` is Redis-free.
redis = [
    "agent-memory-client>=0.14.0",
    "redis>=5.0.0,<9.0.0",
]

# LLM provider (Claude-native architecture)
anthropic = ["anthropic>=0.40.0"]
llm = [
    "anthropic>=0.40.0",
]

# MemDocs integration for long-term memory
memdocs = [
    "memdocs>=1.0.0",  # Published on PyPI
]

# LangChain ecosystem for agents/workflows
agents = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.2.28,<2.0.0",  # CVE-2026-40087 fix
    "langchain-text-splitters>=1.1.2,<1.2.0",  # GHSA-fv5p-p927-qmxr fix
    "langgraph>=1.0.0,<2.0.0",  # 1.0+ required for langgraph-checkpoint 3.0 (RCE fix)
    "langgraph-checkpoint>=3.0.0,<5.0.0",  # Security: GHSA-wwqv-p2pp-99h5 (RCE fix)
    "marshmallow>=4.1.2,<5.0.0",  # Security: GHSA-428g-f7cq-pgp5
]

# CrewAI removed in v3.1.3 (was deprecated in v4.4.0)
# The meta-workflow system provides equivalent functionality using Anthropic SDK directly.
# See docs/CREWAI_MIGRATION.md for migration guide.
# crewai_adapter.py kept for backward compatibility (lazy-loaded, no core dep)

# Cache extra removed — Anthropic's built-in prompt caching (90% discount)
# is automatic via the Claude Agent SDK. Kept as empty extra for backward
# compatibility with pip install 'attune-ai[cache]'.
cache = []

# Anthropic Agent SDK — now a core dependency (moved to [project.dependencies])
# Kept as empty extra for backward compatibility with pip install 'attune-ai[agent-sdk]'
agent-sdk = []

# Software development plugin (code review, bug prediction, etc.)
# NOTE: attune-software is bundled in this repo at attune_software/
software = []

# Backend API server (optional) - authentication
backend = [
    "fastapi>=0.109.1,<1.0.0",  # CVE fix: PYSEC-2024-38
    "uvicorn>=0.20.0,<1.0.0",
    "starlette>=0.40.0,<2.0.0",  # CVE fix: GHSA-f96h, GHSA-2c2j
    "bcrypt>=4.0.0,<6.0.0",  # Password hashing (cost factor 12)
    "PyJWT[crypto]>=2.12.0,<3.0.0",  # JWT auth - uses cryptography (no ecdsa CVE); >=2.12.0 fixes GHSA-752w-5fwx-jx9f
]

# LSP server for editor integration (optional)
lsp = [
    "pygls>=1.0.0,<3.0.0",
    "lsprotocol>=2023.0.0,<2026.0.0",
]

# Windows compatibility
windows = [
    "colorama>=0.4.6,<1.0.0",  # ANSI color support for Windows CMD
]

# Operations dashboard (`attune ops`) — local FastAPI UI for workflows,
# telemetry, memory, releases. No npm, no build step. Read-only by default.
ops = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
]

# OpenTelemetry backend for enterprise telemetry export
otel = [
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2.0.0",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.4.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<2.0.0",
    "mkdocs-with-pdf>=0.9.3,<1.0.0",  # PDF/ePub generation
    # pymdown-extensions 10.20.x passes title=None through as the
    # filename kwarg, which crashes pygments 2.20+'s stricter
    # html.escape() (AttributeError on .replace). 10.21.0 fixes
    # the upstream bug — keep the floor pinned past it.
    "pymdown-extensions>=10.21,<12.0",
]

# Development dependencies
dev = [
